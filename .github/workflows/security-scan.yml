name: Container security scan

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Scan published image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Inspect published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/dadeeen/no-one-survived-server:latest
          format: json
          output: ${{ runner.temp }}/nos-published-vulnerabilities.json
          exit-code: "0"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Apply severity policy
        run: bash scripts/check-image-vulnerabilities.sh "$RUNNER_TEMP/nos-published-vulnerabilities.json"
