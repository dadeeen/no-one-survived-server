name: Real server integration test

on:
  workflow_dispatch:
    inputs:
      full_runtime:
        description: Wait for a real A2S response before stopping
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  integration:
    # Docker 29.4.2 on Ubuntu 26.04 blocks 32-bit SteamCMD networking (moby/moby#52506).
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build --build-arg VERSION=integration-${GITHUB_SHA} -t nos-integration:local .

      - name: Run integration test
        env:
          FULL_RUNTIME: ${{ inputs.full_runtime }}
        run: bash ./scripts/integration-test.sh

      - name: Show final state and logs
        if: always()
        run: |
          docker exec no-one-survived-integration nosctl status || true
          docker logs --tail 300 no-one-survived-integration || true

      - name: Stop test container
        if: always()
        run: docker rm -f no-one-survived-integration || true
